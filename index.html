<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Radio - Live Player</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #111111, #1f1f1f);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 350px;
            width: 100%;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #1db954;
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.4);
            transition: all 0.3s ease;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 5px 0;
        }
        .now-playing {
            margin: 20px 0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .song-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
            word-break: break-word;
        }
        .song-artist {
            font-size: 13px;
            color: #aaaaaa;
            word-break: break-word;
        }
        .status {
            font-size: 12px;
            color: #888888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .status.live {
            color: #1db954;
            font-weight: bold;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 15px 0;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(29,185,84,0.4);
        }
        button:hover {
            background-color: #1ed760;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Εξώφυλλο τραγουδιού ή Λογότυπο σταθμού -->
        <img src="https://raw.githubusercontent.com/ngeorg72/simple-radio-app/main/logo_big.png" alt="Album Art" class="logo" id="artImage">
        
        <h1>Simple Radio</h1>
        
        <div class="now-playing">
            <div id="songTitle" class="song-title">Simple Radio Stream</div>
            <div id="songArtist" class="song-artist">Ζωντανή αναπαραγωγή</div>
        </div>

        <div id="statusText" class="status">○ Σε αναμονή</div>

        <audio id="radioStream" src="https://ice.streams.ovh:1765/stream"></audio>

        <button onclick="togglePlay()" id="playBtn">PLAY</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }

        const audio = document.getElementById('radioStream');
        const btn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');
        const songTitleEl = document.getElementById('songTitle');
        const songArtistEl = document.getElementById('songArtist');
        const artImage = document.getElementById('artImage');
        const defaultLogo = "https://raw.githubusercontent.com/ngeorg72/simple-radio-app/main/logo_big.png";

        let metadataInterval;

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                btn.innerText = "PAUSE";
                btn.style.backgroundColor = "#ff4b4b";
                statusText.innerText = "● LIVE ON AIR";
                statusText.classList.add("live");
                
                fetchMetadata();
                metadataInterval = setInterval(fetchMetadata, 10000);
            } else {
                audio.pause();
                btn.innerText = "PLAY";
                btn.style.backgroundColor = "#1db954";
                statusText.innerText = "○ Σε αναμονή";
                statusText.classList.remove("live");
                
                clearInterval(metadataInterval);
            }
        }

        async function fetchMetadata() {
            try {
                const response = await fetch('https://ice.streams.ovh:1765/status-json.xsl');
                const data = await response.json();
                
                let track = data.icestats.source;
                if (Array.isArray(track)) {
                    track = track[0];
                }

                if (track && track.title) {
                    let fullTitle = track.title;
                    let parts = fullTitle.split('-');
                    
                    let artist = parts[0] ? parts[0].trim() : "Simple Radio";
                    let song = parts[1] ? parts.slice(1).join('-').trim() : fullTitle;

                    songTitleEl.innerText = song;
                    songArtistEl.innerText = artist;

                    fetchAlbumArt(artist, song);
                }
            } catch (error) {
                console.log("Σφάλμα φόρτωσης metadata:", error);
            }
        }

        async function fetchAlbumArt(artist, song) {
            try {
                const query = encodeURIComponent(artist + ' ' + song);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    let artwork = data.results[0].artworkUrl100.replace('100x100bb.jpg', '300x300bb.jpg');
                    artImage.src = artwork;
                } else {
                    artImage.src = defaultLogo;
                }
            } catch (e) {
                artImage.src = defaultLogo;
            }
        }
    </script>

</body>
</html>
