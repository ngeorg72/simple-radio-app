<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Radio - Official Web Radio Player</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #111111, #1f1f1f);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 350px;
            width: 100%;
        }
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid #1db954;
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.4);
        }
        h1 {
            font-size: 22px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
            margin: 0 0 25px 0;
        }
        .status {
            font-size: 12px;
            color: #888888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .status.live {
            color: #1db954;
            font-weight: bold;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 15px 0;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(29,185,84,0.4);
        }
        button:hover {
            background-color: #1ed760;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Το λογότυπο του Simple Radio -->
        <img src="https://raw.githubusercontent.com/ngeorg72/simple-radio-app/main/logo_big.png" alt="Simple Radio Logo" class="logo" id="stationLogo">
        
        <h1>Simple Radio</h1>
        <p>Η μουσική σου συντροφιά παντού</p>

        <div id="statusText" class="status">○ Σε αναμονή</div>

        <audio id="radioStream" src="https://ice.streams.ovh:1765/stream"></audio>

        <button onclick="togglePlay()" id="playBtn">PLAY</button>
    </div>

    <script>
        const audio = document.getElementById('radioStream');
        const btn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                btn.innerText = "PAUSE";
                btn.style.backgroundColor = "#ff4b4b";
                statusText.innerText = "● LIVE ON AIR";
                statusText.classList.add("live");
            } else {
                audio.pause();
                btn.innerText = "PLAY";
                btn.style.backgroundColor = "#1db954";
                statusText.innerText = "○ Σε αναμονή";
                statusText.classList.remove("live");
            }
        }
    </script>

</body>
</html>
